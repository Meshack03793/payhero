<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="deparmentLogin.css">
    <script src="https://kit.fontawesome.com/1178a756b1.js" crossorigin="anonymous"></script>
</head>
<body>

   <div id="login">
     <form id="form">
        <h1>Login</h1>

       <div>
         <label for="name">Full Name</label><br>
         <input type="text" id="name" placeholder="Your name" ><br>
         <p id="nameError" class="error"></p>
       </div>
        
       <div>
        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="name@example.com"><br>
        <p id="emailError" class="error"></p>
       </div>
        
       <div>
        <label for="password">Password</label><br>
        <input type="password" id="password" placeholder="Min 8 characters"><br>
        <p id="passwordError" class="error"></p>
       </div>
         <div>
             <label for="confirmPassword">Confirm Password</label><br>
            <input type="password" id="confirmPassword"  placeholder="Repeat password"><br>
            <p id="confirmError" class="error"></p>
         </div>
        <button type="submit" id="button" onclick="goToDepartment()">Login</button>
    </form>
   </div>
   <p id="result"></p>
<script src="departmentLogin.js"></script>
</body>
</html>
